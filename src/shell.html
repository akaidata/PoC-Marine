<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark">
        <span class="glyph">__GLYPH__</span>
        <h1>__APPNAME__</h1>
      </div>
      <span class="sub">__APPSUB__</span>
    </div>

    <div class="role">
      <span class="ic">__WHOIC__</span>
      <span class="who"><b>__WHO__</b><span>__WHOROLE__</span></span>
    </div>

    <div class="side-group">

  <main class="main">

__PANES__
